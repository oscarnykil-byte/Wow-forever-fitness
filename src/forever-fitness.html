<title>Forever Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: MMO-gränssnitt – en "unit frame" överst, actionbar-flikar med snabbtangenter 1–4, paneler som sidor i en questlogg */
:root{
  --bg:#10121a; --bg-glow:#1d1b33; --panel:#191c29; --panel-2:#222739; --line:#323850; --line-2:#454c68;
  --fg:#ece6d6; --muted:#a0a3b6; --faint:#6f7389;
  --gold:#e6b04a; --gold-ink:#1b1408; --gold-dim:#7d6029;
  --xp:#8e63f0; --xp-2:#b493ff; --hp:#d9483b; --hp-2:#f07a5c; --ok:#45c06a;
  --q-common:#bdbdbd; --q-uncommon:#45c06a; --q-rare:#4d8ff5; --q-epic:#b06df5; --q-legend:#f08a2c;
  --c-str:#e0794a; --c-leg:#4d8ff5; --c-core:#45c06a; --c-cardio:#e6c14a;
  --f-display:"Grenze Gotisch",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -120px,var(--bg-glow),transparent 70%);background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1040px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:lowercase}

/* ---------- Unit frame ---------- */
.frame{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.portrait{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a3150,#16141f);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--gold-dim)}
.portrait span{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold);transform:translateY(-2px)}
.portrait .lvl-badge{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:13px;min-width:30px;text-align:center;padding:1px 7px;border-radius:999px;border:2px solid var(--bg)}
.who{min-width:0;display:flex;flex-direction:column;gap:6px}
.who h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.who .sub{color:var(--muted);font-size:15px}
.who .sub b{color:var(--gold);font-weight:700}
.xpbar{position:relative;height:16px;border-radius:999px;background:#0b0c12;border:1px solid var(--line-2);overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,var(--xp-2),var(--xp));border-radius:999px}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),rgba(0,0,0,.45) calc(5% - 1px) 5%)}
.xpbar.rested i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.xpline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.chip{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#0e1018;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
.chip b{font-size:17px}
.chip.streak b{color:var(--q-legend)}
.chip.gold b{color:var(--gold)}
.rested-note{font-size:13px;color:var(--xp-2)}

/* ---------- Action bar tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 14px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.tab:hover{border-color:var(--line-2);background:var(--panel-2)}
.tab[aria-selected="true"]{border-color:var(--gold);background:linear-gradient(180deg,#2a2618,var(--panel))}
.tab .key{position:absolute;top:6px;right:9px;font-size:12px;color:var(--faint);font-weight:700}
.tab strong{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.1}
.tab small{color:var(--muted);font-size:13px}
.tab[aria-selected="true"] strong{color:var(--gold)}

/* ---------- Panels ---------- */
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.grid > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.1;color:var(--gold)}
.panel .lead{color:var(--muted);font-size:15px;max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:15px;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
html:not(.has-motion) .btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#f2c461,var(--gold));color:var(--gold-ink);border-color:#f5d48a}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{border-color:#7b2f29;color:#ffb3a8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Event buttons */
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ev{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .08s}
.ev:hover{border-color:var(--gold-dim)}
html:not(.has-motion) .ev:active{transform:scale(.98)}
.ev .ev-n{font-weight:800;font-size:16px}
.ev .ev-x{color:var(--muted);font-size:14px}
.ev .ev-x b{color:var(--fg)}
.ev .ev-tag{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;color:var(--gold)}

/* Alarm */
.alarm{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.clock{font-family:var(--f-display);font-size:54px;line-height:1;color:var(--fg);min-width:4.2ch;font-variant-numeric:tabular-nums}
.clock.on{color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 12px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* Log list */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .t{color:var(--faint);font-size:13px}
.log .n{min-width:0}
.log .n small{color:var(--muted);margin-left:6px}
.log .x{color:var(--xp-2);font-weight:700;font-size:14px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* Quality / rarity */
.q{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;font-weight:700}
.q-common{color:var(--q-common)} .q-uncommon{color:var(--q-uncommon)} .q-rare{color:var(--q-rare)} .q-epic{color:var(--q-epic)} .q-legend{color:var(--q-legend)}
.catdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Exercise picker */
.cats{display:flex;flex-direction:column;gap:16px}
.cat-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.cat-h h3{font-size:16px;font-weight:800}
.cat-h span{color:var(--muted);font-size:14px}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.exbtn{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.exbtn:hover{border-color:var(--line-2)}
.exbtn .en{font-weight:700;min-width:0}
.exbtn .ea{color:var(--muted);font-size:14px;white-space:nowrap}

/* Dungeon */
.dungeon-name{font-family:var(--f-display);font-size:24px;line-height:1.1}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.room{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.room .ri{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#0e1018;border:1px solid var(--line-2);color:var(--muted)}
.room.done{opacity:.55}
.room.done .ri{background:var(--ok);color:#06240f;border-color:var(--ok)}
.room.cur{border-color:var(--gold)}
.room.cur .ri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.room.boss .mob{color:var(--q-epic)}
.room .mob{font-size:13px;color:var(--muted);font-family:var(--f-label);letter-spacing:.05em}
.room .rx{font-weight:700}

/* Quests */
.quest{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.quest.ready{border-color:var(--gold)}
.quest.claimed{opacity:.55}
.quest-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.quest-top b{font-size:16px}
.reward{font-size:13px;color:var(--muted);white-space:nowrap}
.reward em{font-style:normal;color:var(--gold)}
.bar{position:relative;height:10px;border-radius:999px;background:#0b0c12;border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--gold)}
.bar.hp{height:20px}
.bar.hp i{background:linear-gradient(180deg,var(--hp-2),var(--hp))}
.bar.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}

.boss{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.crest{width:72px;height:80px;display:grid;place-items:center;background:linear-gradient(180deg,#4a1f1f,#1c0e10);clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);font-family:var(--f-display);font-size:38px;color:var(--hp-2)}
.boss h3{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1}
.boss .bt{color:var(--muted);font-size:14px}
.lore{font-style:italic;color:var(--muted);font-size:15px}

/* Hero tab */
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;font-size:15px}
.stat .v{text-align:right;font-weight:800}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2);display:flex;flex-direction:column;gap:2px}
.ach div b{font-size:14px}
.ach div small{font-size:12px;color:var(--muted);line-height:1.3}
.ach div.locked{opacity:.4;filter:grayscale(1)}
.ach div.got{border-color:var(--gold-dim)}
.ach div.got b{color:var(--gold)}
.shop{display:flex;flex-direction:column;gap:8px}
.shop-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.shop-item div{min-width:0}
.shop-item small{display:block;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:14px;color:var(--muted);font-weight:700}
input[type=text],select,textarea{font:inherit;color:var(--fg);background:#0e1018;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:76px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px}
.checks input{accent-color:var(--gold);width:16px;height:16px}
.duel{width:100%;border-collapse:collapse;font-size:15px}
.duel th{text-align:left;font-family:var(--f-label);font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.duel td{padding:8px;border-bottom:1px solid var(--line)}
.duel td.r,.duel th.r{text-align:right}
.duel tr.me td:first-child{color:var(--gold);font-weight:800}
.tablewrap{overflow-x:auto}
.heroes{display:flex;flex-wrap:wrap;gap:8px}

/* Rules editor */
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.rule > span{font-weight:700;min-width:0}
.rule select,.rule input{padding:8px 10px}
.rule .x{width:36px;height:36px;padding:0}
.rule.add{border-style:dashed;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto}
/* Progress */
.prog{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.prog > div{min-width:0;display:flex;flex-direction:column;gap:8px}
.chart-h{display:flex;flex-direction:column;gap:2px}
.chart-h b{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chart-h b select{width:auto;max-width:100%;padding:5px 8px;font-size:15px}
.chart-h span{color:var(--muted);font-size:14px}
.chart-h .insight{color:var(--fg)}
.chart-h .insight em{font-style:normal;color:var(--gold);font-weight:800}
.chart{width:100%;min-height:180px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1;fill:none}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .bar-xp{fill:var(--xp)}
.chart .bar-xp.today{fill:var(--xp-2)}
.chart .ln{stroke:var(--gold);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--gold);stroke:var(--panel);stroke-width:2}
.chart .pt.pb{fill:var(--q-legend)}
.chart .lbl{fill:var(--fg);font-size:13px;font-weight:800;font-family:var(--f-body)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover + .hl,.chart .hl{pointer-events:none}
.chart-empty{display:grid;place-items:center;min-height:180px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);text-align:center;padding:16px;font-size:15px}
#tip{position:fixed;z-index:70;pointer-events:none;background:#0b0c12;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--fg);box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap}
#tip b{color:var(--gold)}
details.pbs summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
details.pbs .tablewrap{margin-top:8px}
@media (max-width:820px){.prog{grid-template-columns:1fr}}
@media (max-width:560px){.rule,.rule.add{grid-template-columns:1fr auto}.rule select{grid-column:1/-1;grid-row:2}}

/* Create */
.create{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px;width:100%}
.create-hero{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.create-hero .eyebrow{font-family:var(--f-label);letter-spacing:.12em;color:var(--gold);font-size:14px}
.create-hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,76px);line-height:.95;color:var(--fg)}
.create-hero p{color:var(--muted);font-size:18px;max-width:56ch}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how div{border-top:2px solid var(--gold-dim);padding-top:10px;font-size:15px;color:var(--muted)}
.how b{display:block;color:var(--fg);font-size:16px;margin-bottom:2px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.cls{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cls b{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.1}
.cls small{color:var(--muted);font-size:13px}
.cls[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#2a2618,var(--panel-2))}
.cls[aria-pressed="true"] b{color:var(--gold)}

/* Modal */
#modal,.modal-ghost{position:fixed;inset:0;z-index:50;background:rgba(5,6,10,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.m-box{width:min(460px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold-dim);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
html:not(.has-motion) .m-box{animation:pop .18s ease-out}
.modal-ghost{pointer-events:none;z-index:49}
.m-box.alarm-box{border-color:var(--hp);box-shadow:0 0 0 2px rgba(217,72,59,.35),0 20px 60px rgba(0,0,0,.6)}
.m-head{display:flex;justify-content:space-between;gap:10px}
.m-title{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1}
.m-ctx{color:var(--gold);font-weight:700}
.alarm-box .m-ctx{color:var(--hp-2)}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.stepper button{height:56px;border-radius:12px;border:1px solid var(--line-2);background:#0e1018;font-size:28px;font-weight:800;cursor:pointer}
.stepper output{text-align:center;font-family:var(--f-display);font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.stepper output small{font-family:var(--f-body);font-size:16px;color:var(--muted);margin-left:6px}
.timer{text-align:center;font-weight:800;color:var(--gold);min-height:1.4em}
.tip{color:var(--muted);font-size:14px}
.xp-preview{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#0e1018;border:1px solid var(--line)}
.xp-preview b{color:var(--xp-2);font-size:20px}
.xp-preview span{color:var(--muted);font-size:13px}
.m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.m-actions .btn{flex:1 1 auto}
.lvl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.lvl .eyebrow{font-family:var(--f-label);letter-spacing:.14em;color:var(--gold)}
.lvl-num{font-family:var(--f-display);font-size:120px;line-height:.9;color:var(--gold);text-shadow:0 0 30px rgba(230,176,74,.45)}
html:not(.has-motion) .lvl-num{animation:rise .5s ease-out}
.lvl p{color:var(--muted)}
.lvl p b{color:var(--fg)}

/* Toasts */
#toasts{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100% - 32px)}
.toast{background:#0e1018;border:1px solid var(--xp);color:var(--fg);padding:10px 14px;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
html:not(.has-motion) .toast{animation:toast 3.2s ease forwards}
.toast.ach{border-color:var(--gold);color:var(--gold)}
.toast.info{border-color:var(--line-2)}
/* Motion effects */
.fly{position:fixed;z-index:85;pointer-events:none;translate:-50% -50%;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--xp-2);text-shadow:0 0 14px rgba(142,99,240,.9),0 2px 4px #000;white-space:nowrap}
.fly.gold{color:var(--gold);text-shadow:0 0 14px rgba(230,176,74,.8),0 2px 4px #000}
.fly.dmg{color:var(--hp-2);text-shadow:0 0 12px rgba(217,72,59,.8),0 2px 4px #000}
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.fx-layer i{position:absolute;border-radius:50%;translate:-50% -50%;box-shadow:0 0 8px currentColor}
.chart .bar-xp,.chart .pt{transform-box:fill-box}
.chart .bar-xp{transform-origin:50% 100%}
.chart .pt{transform-origin:50% 50%}
.ev,.exbtn,.btn,.tab,.cls,.quest,.room,.panel{will-change:auto}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .frame{grid-template-columns:auto 1fr}

}

function eventsFor(p){const ok=k=>EX[k]&&pool().includes(k);return EVENTS.map(e=>{const m=p.evmap[e.id];return m&&m!==e.ex&&ok(m)?Object.assign({},e,{ex:m,f:1}):e}).concat(p.customEvents.filter(c=>ok(c.ex)).map(c=>({id:c.id,n:c.n,tag:'Egen regel',ex:c.ex,f:1})))}
const MON=['jan','feb','mars','apr','maj','juni','juli','aug','sep','okt','nov','dec'];

];

/* ================= Storage ================= */
const LS='forever-fitness-v1';
function loadState(){try{const r=localStorage.getItem(LS);if(r){const s=JSON.parse(r);if(s&&s.profiles)return s}}catch(e){}return {profiles:{},active:null,tab:'spela',alarm:{on:false,min:30,end:0}}}
let S=loadState();
S.alarm=S.alarm||{on:false,min:30,end:0};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10);
function norm(p){p=p||{};if(OLD_CLS[p.cls])p.cls=OLD_CLS[p.cls];if(!CLASSES[p.cls])p.cls='warrior';return Object.assign({id:uid(),name:'Hjälte',cls:'warrior',diff:'normal',equip:[],log:[],gold:0,freezes:0,frozen:[],ach:{},titles:[],title:'',qcache:null,qclaimed:{},bossKills:{},dungeon:null,rivals:[],evmap:{},customEvents:[],created:Date.now()},p)}
Object.keys(S.profiles).forEach(k=>S.profiles[k]=norm(S.profiles[k]));
const P=()=>S.profiles[S.active];

/* ================= Utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey();
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const weekStart=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x)};
const weekIndex=ws=>{const [y,m,d]=ws.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/(7*864e5))};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const short=n=>n.replace(/\s*\(.*\)/,'');
const unitLbl=(e,a)=>e.unit==='sec'?'s':'st';
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s))));

/* ================= Game rules ================= */
const need=L=>50+25*L;
function levelInfo(xp){let L=1,acc=0;while(L<60&&xp>=acc+need(L)){acc+=need(L);L++}return {L,into:xp-acc,need:L<60?need(L):0}}
const totalXP=p=>p.log.reduce((a,x)=>a+x.xp,0);
const todayLog=p=>{const d=today();return p.log.filter(x=>x.d===d)};
const weekXP=p=>{const ws=weekStart();return p.log.filter(x=>x.d>=ws).reduce((a,x)=>a+x.xp,0)};
function rankFor(L){let r=RANKS[0][1];for(const [l,n] of RANKS)if(L>=l)r=n;return r}
function pool(cat,unit){const p=P();return Object.keys(EX).filter(k=>{const e=EX[k];if(cat&&e.cat!==cat)return false;if(unit&&e.unit!==unit)return false;return !e.eq||e.eq.some(q=>p.equip.includes(q))})}
function target(ex,f=1){const e=EX[ex],p=P();const L=levelInfo(totalXP(p)).L;const a=e.base*DIFF[p.diff].m*(1+Math.min(L,60)*.01)*f;return e.unit==='sec'?Math.max(10,Math.round(a/5)*5):Math.max(3,Math.round(a))}
function activeDays(p){const s=new Set(p.log.filter(x=>x.ex).map(x=>x.d));(p.frozen||[]).forEach(d=>s.add(d));return s}
function streak(p){const s=activeDays(p);let d=today();if(!s.has(d))d=addDays(d,-1);let n=0;while(s.has(d)){n++;d=addDays(d,-1)}return n}
function autoFreeze(p){const s=activeDays(p);const y=addDays(today(),-1),yy=addDays(today(),-2);if(!s.has(y)&&s.has(yy)&&p.freezes>0){p.freezes--;p.frozen.push(y);save();toast('Svitskydd användes. Din svit lever!','ach')}}
const isRested=p=>!todayLog(p).some(x=>x.ex);
function calcXP(ex,amt,src){
  const p=P(),e=EX[ex];const ratio=Math.min(2,amt/target(ex));const mults=[];
  const C=CLASSES[p.cls];
  if(isRested(p))mults.push(['Utvilad',C.rested||2]);
  const cb=((C.bonus||{})[e.cat]||0)+(e.unit==='sec'?(C.sec||0):0)+((C.src||{})[src]||0);if(cb)mults.push([C.n,+(1+cb).toFixed(2)]);
  if(src==='event')mults.push(['Spelhändelse',1.5]);
  if(src==='alarm')mults.push(['Raidvarning',1.5]);
  if(src==='dungeon')mults.push(['Dungeon',1.2]);
  const st=streak(p);if(st>1)mults.push([`Svit ${st} dagar`,+(1+Math.min(.3,st*.02)).toFixed(2)]);
  const m=mults.reduce((a,[,v])=>a*v,1);
  return {xp:Math.max(1,Math.round(12*e.w*ratio*m)),mults};
}
function counts(p){
  const c={sets:0,ex:{},catxp:{str:0,leg:0,core:0,cardio:0},events:0,deaths:0,alarms:0,dungeons:0,bosses:Object.keys(p.bossKills||{}).length};
  for(const x of p.log){if(x.ex){c.sets++;c.ex[x.ex]=(c.ex[x.ex]||0)+x.amt;c.catxp[x.cat]+=x.xp;if(x.src==='event')c.events++;if(x.ev==='death')c.deaths++;if(x.src==='alarm')c.alarms++}if(x.src==='chest')c.dungeons++}
  c.level=levelInfo(totalXP(p)).L;c.streak=streak(p);c.allcats=new Set(todayLog(p).filter(x=>x.cat).map(x=>x.cat)).size>=4;return c;
}
function checkAch(){const p=P();const c=counts(p);for(const [id,n,,t] of ACH){if(!p.ach[id]&&t(c)){p.ach[id]=today();p.gold+=20;toast(`Bedrift: ${n} (+20 guld)`,'ach')}}}

/* Quests */
function getQuests(p){
  const d=today();if(p.qcache&&p.qcache.day===d)return p.qcache.list;
  const r=rng(d+p.id);const pk=a=>a[Math.floor(r()*a.length)];
  const types=['reps','sec','cats','events','sets','dungeon','xp'];const chosen=[];
  while(chosen.length<3){const t=pk(types);if(!chosen.includes(t))chosen.push(t)}
  const list=chosen.map(t=>{
    if(t==='reps'){const ex=pk(pool(null,'reps'));const g=target(ex)*3;return {id:t,ex,goal:g,label:`Gör ${g} st ${short(EX[ex].n).toLowerCase()}`,hint:'Fördela över flera set under dagen.',xp:60,gold:20}}
    if(t==='sec'){const ex=pk(pool(null,'sec'));const g=target(ex)*3;return {id:t,ex,goal:g,label:`${short(EX[ex].n)} i totalt ${g} sekunder`,hint:'Flera korta set räknas ihop.',xp:60,gold:20}}
    if(t==='cats')return {id:t,goal:4,label:'Träna alla fyra kategorier',hint:'Styrka, benkraft, bål och kondition.',xp:70,gold:25};
    if(t==='events')return {id:t,goal:3,label:'Logga 3 spelhändelser',hint:'Dog du? Laddningsskärm? Tryck under Spela.',xp:50,gold:20};
    if(t==='sets')return {id:t,goal:8,label:'Gör 8 set',hint:'Valfria övningar.',xp:60,gold:20};
    if(t==='dungeon')return {id:t,goal:1,label:'Klara en dungeon-runda',hint:'Fem rum, en boss. Under Träna.',xp:60,gold:25};
    return {id:'xp',goal:150,label:'Tjäna 150 XP på träning',hint:'Bonusar räknas.',xp:50,gold:20};
  });
  p.qcache={day:d,list};p.qclaimed={[d]:(p.qclaimed&&p.qclaimed[d])||[]};save();return list;
}
function qProgress(q,tl){

function niceScale(max){if(max<=0)max=1;const raw=max/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);const top=Math.ceil(max/step)*step;const ticks=[];for(let v=0;v<=top+1e-9;v+=step)ticks.push(Math.round(v*100)/100);return {top,ticks}}

      </section>
      <section class="panel"><div class="panel-head"><h2>Bedrifter</h2><span class="label num">${Object.keys(p.ach).length} / ${ACH.length}</span></div>
        <div class="ach">${ACH.map(([id,n,d])=>`<div class="${p.ach[id]?'got':'locked'}"><b>${n}</b><small>${d}</small></div>`).join('')}</div>
      </section>
      <section class="panel"><div class="panel-head"><h2>Inställningar</h2></div>
        <label class="field"><span>Namn</span><input type="text" id="s-name" maxlength="24" value="${esc(p.name)}"></label>
        <label class="field"><span>Klass</span><select id="s-cls">${Object.entries(CLASSES).map(([k,c])=>`<option value="${k}" ${p.cls===k?'selected':''}>${c.n} – ${c.d}</option>`).join('')}</select></label>
        <div class="field"><span>Svårighet</span><div class="seg" role="group">${Object.entries(DIFF).map(([k,d])=>`<button type="button" data-act="setDiff" data-v="${k}" aria-pressed="${p.diff===k}">${d.n}</button>`).join('')}</div></div>
        <div class="field"><span>Redskap hemma</span><div class="checks">${Object.entries(EQUIP).map(([k,n])=>`<label><input type="checkbox" data-act="setEq" value="${k}" ${p.equip.includes(k)?'checked':''}>${n}</label>`).join('')}</div></div>
        <div class="field"><span>Hjältar på den här enheten</span><div class="heroes">${Object.values(S.profiles).map(h=>`<button type="button" class="btn small ${h.id===p.id?'primary':''}" data-act="switch" data-v="${h.id}">${esc(h.name)}</button>`).join('')}<button type="button" class="btn small ghost" data-act="newHero">+ Ny hjälte</button></div></div>
        <label class="field"><span>Säkerhetskopia</span><textarea id="backupCode" readonly>WFFB-${b64e(p)}</textarea></label>
        <p class="tip">Sparas bara i den här webbläsaren. Kopiera koden ibland och spara den, så kan du återställa hjälten om webbläsardatan rensas.</p>
        <div class="row"><button type="button" class="btn small" data-act="copy" data-v="backupCode">Kopiera säkerhetskopia</button>
          <button type="button" class="btn small danger" data-act="delete">${confirmDelete?'Säker? Tryck igen för att radera':'Radera hjälten'}</button></div>
      </section>
    </div>
  </div>`;
}
function heroCard(p){return 'WFF1-'+b64e({n:p.name,l:levelInfo(totalXP(p)).L,w:weekXP(p),ws:weekStart(),s:streak(p),at:Date.now()})}

/* ================= Events ================= */
document.addEventListener('click',ev=>{
  const m=$('#modal');
  if(ev.target===m&&!m.hidden){const c=pending&&pending.ctx.onCancel;closeModal();c&&c();return}
  const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;lastRect=el.getBoundingClientRect();
  const a=el.dataset.act,v=el.dataset.v;const p=P();
  switch(a){
    case 'tab':S.tab=v;confirmDelete=false;save();renderAll();window.scrollTo({top:0});break;
    case 'draftCls':draft.name=$('#c-name').value;draft.cls=v;renderAll();break;
    case 'draftDiff':draft.name=$('#c-name').value;draft.diff=v;renderAll();break;
    case 'create':{const name=($('#c-name').value||'').trim();if(!name){toast('Ge hjälten ett namn först','info');$('#c-name').focus();return}const np=norm({name,cls:draft.cls,diff:draft.diff,equip:draft.equip.slice()});S.profiles[np.id]=np;S.active=np.id;S.tab='spela';draft={name:'',cls:'warrior',diff:'normal',equip:[]};save();renderAll();toast(`Välkommen, ${name}!`,'ach');break}
    case 'cancelCreate':S.active=S.active&&S.profiles[S.active]?S.active:Object.keys(S.profiles)[0];renderAll();break;
    case 'event':{const e=eventsFor(p).find(x=>x.id===v);if(!e)return;openLog(e.ex,'event',e.f,{title:e.n,ev:e.id});break}
    case 'ex':openLog(v,'free',1,{});break;
    case 'amt':{const e=EX[pending.ex];const step=e.unit==='sec'?5:(pending.amt>=20?5:1);pending.amt=Math.max(e.unit==='sec'?5:1,pending.amt+step*Number(v));drawLog(true);break}
    case 'timer':{if(pending.timer)return;ensureAudio();const end=Date.now()+pending.amt*1000;const pd=pending;pd.timer={iv:setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));const t=$('#tmr');if(t)t.textContent=left>0?`${left} s kvar`:'Tiden är ute. Bra kämpat!';if(left<=0){clearInterval(pd.timer.iv);beep('done')}},250)};el.textContent='Timern går';break}
    case 'done':{const {ex,amt,src,ctx}=pending;closeModal();if(src==='alarm'){alarmFiring=false}logSet(ex,amt,src,ctx.ev);ctx.onDone&&ctx.onDone();break}
    case 'cancel':case 'close':{const c=pending&&pending.ctx.onCancel;closeModal();c&&c();break}
    case 'snooze':{closeModal();S.alarm.end=Date.now()+5*60000;alarmFiring=false;save();toast('Raidvarning om 5 minuter','info');break}
    case 'undo':{const t=Number(v);const i=p.log.findIndex(x=>x.t===t);if(i>=0){const x=p.log.splice(i,1)[0];save();renderAll();toast(`Ångrade ${short(EX[x.ex].n)} (−${x.xp} XP)`,'info')}break}
    case 'alarmMin':S.alarm.min=Number(v);if(S.alarm.on)armAlarm();save();renderAll();break;
    case 'alarmStart':startAlarm();break;
    case 'alarmStop':stopAlarm();break;
    case 'alarmNow':ensureAudio();S.alarm.end=Date.now();save();break;
    case 'dungeon':newDungeon();break;
    case 'room':doRoom();break;
    case 'abandon':p.dungeon=null;save();renderAll();toast('Du flydde från dungeonen. Den finns kvar imorgon.','info');break;
    case 'claim':{const qs=getQuests(p);const q=qs[Number(v)];const cl=p.qclaimed[today()]=p.qclaimed[today()]||[];if(q&&!cl.includes(Number(v))){cl.push(Number(v));burstAt(lastRect,28,150);grant(q.xp,q.gold,'quest',`Uppdrag klart! +${q.xp} XP, +${q.gold} guld`)}break}
    case 'bossClaim':{const {ws,b}=bossNow();if(!p.bossKills[ws]&&weekXP(p)>=BOSS_HP){p.bossKills[ws]=true;beep('lvl');burstAt($('.crest')&&$('.crest').getBoundingClientRect(),60,260);grant(0,150,'boss',`${b.n} är fälld! +150 guld`)}break}
    case 'buy':{const it=SHOP.find(x=>x.id===v);if(!it||p.gold<it.cost)return;if(it.id==='freeze'){if(p.freezes>=2)return;p.freezes++}else{p.titles.push(it.title);p.title=it.title}p.gold-=it.cost;save();renderAll();toast(`Köpt: ${it.n}`,'ach');break}
    case 'setDiff':p.diff=v;p.qcache=p.qcache&&p.qcache.day===today()?p.qcache:null;save();renderAll();break;
    case 'switch':S.active=v;confirmDelete=false;save();renderAll();break;
    case 'newHero':S.active=null;renderAll();break;
    case 'delete':if(!confirmDelete){confirmDelete=true;renderAll();return}delete S.profiles[p.id];S.active=Object.keys(S.profiles)[0]||null;confirmDelete=false;save();renderAll();toast('Hjälten är raderad','info');break;
    case 'copy':{const ta=document.getElementById(v);const txt=ta.value;const ok=()=>toast('Kopierat','info');const fb=()=>{ta.focus();ta.select();toast('Markerat. Tryck Ctrl+C för att kopiera','info')};try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}break}
    case 'addRival':{const raw=($('#rivalCode').value||'').trim();try{if(!raw.startsWith('WFF1-'))throw 0;const r=b64d(raw.slice(5));if(typeof r.n!=='string'||typeof r.w!=='number')throw 0;if(r.n===p.name&&Math.abs((r.at||0)-Date.now())<5000)throw 0;const o={n:String(r.n).slice(0,24),l:Number(r.l)||1,w:Number(r.w)||0,ws:String(r.ws||''),s:Number(r.s)||0,at:Number(r.at)||0};p.rivals=p.rivals.filter(x=>x.n!==o.n);p.rivals.push(o);save();renderAll();toast(`${o.n} tillagd i duellen`,'ach')}catch(e){toast('Koden fungerade inte. Den ska börja med WFF1-','info')}break}
    case 'editRules':editRules=!editRules;save();renderAll();break;
    case 'resetRules':p.evmap={};save();renderAll();toast('Standardreglerna är tillbaka','info');break;
    case 'addCustom':{const n=($('#newEvName').value||'').trim();if(!n){toast('Skriv vad som händer i spelet först','info');$('#newEvName').focus();return}if(p.customEvents.length>=12){toast('Max 12 egna händelser','info');return}p.customEvents.push({id:'c_'+uid(),n:n.slice(0,32),ex:$('#newEvEx').value});save();renderAll();toast(`Ny regel: ${n}`,'ach');break}
    case 'rmCustom':p.customEvents=p.customEvents.filter(c=>c.id!==v);save();renderAll();break;
    case 'progRange':S.prog.range=Number(v);chartAnim=true;save();renderAll();break;
    case 'rmRival':p.rivals=p.rivals.filter(x=>x.n!==v);save();renderAll();break;
    case 'importBackup':{const raw=($('#importCode').value||'').trim();try{if(!raw.startsWith('WFFB-'))throw 0;const o=norm(b64d(raw.slice(5)));if(!Array.isArray(o.log)||!CLASSES[o.cls]||!DIFF[o.diff])throw 0;S.profiles[o.id]=o;S.active=o.id;save();renderAll();toast(`${o.name} är tillbaka!`,'ach')}catch(e){toast('Koden fungerade inte. Den ska börja med WFFB-','info')}break}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;const p=P();
  if(t.dataset.act==='draftEq'){draft.equip=t.checked?draft.equip.concat(t.value):draft.equip.filter(x=>x!==t.value);return}
  if(!p)return;
  if(t.dataset.act==='setEq'){p.equip=t.checked?p.equip.concat(t.value):p.equip.filter(x=>x!==t.value);if(p.qcache&&p.qcache.day===today()){/* keep today's quests */}save();renderAll();return}
  if(t.id==='s-name'){const n=t.value.trim();if(n){p.name=n.slice(0,24);save();renderAll()}return}
  if(t.id==='s-cls'){p.cls=t.value;save();renderAll();return}
  if(t.dataset.rule){const e=EVENTS.find(x=>x.id===t.dataset.rule);if(t.value===e.ex)delete p.evmap[e.id];else p.evmap[e.id]=t.value;save();toast('Regeln är sparad','info');return}
  if(t.dataset.crule){const c=p.customEvents.find(x=>x.id===t.dataset.crule);if(c){c.ex=t.value;save();toast('Regeln är sparad','info')}return}
  if(t.id==='pbSel'){S.prog.ex=t.value;chartAnim=true;save();renderAll();return}
  if(t.id==='titleSel'){p.title=t.value;save();renderAll();return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='c-name')draft.name=ev.target.value});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#modal').hidden){const c=pending&&pending.ctx.onCancel;closeModal();c&&c();return}
  if(!P()||!$('#modal').hidden)return;
  const tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const map={'1':'spela','2':'trana','3':'uppdrag','4':'hjalte'};if(map[ev.key]){S.tab=map[ev.key];save();renderAll()}
});

/* ================= Boot ================= */
if(S.active&&!S.profiles[S.active])S.active=Object.keys(S.profiles)[0]||null;
if(!S.active&&Object.keys(S.profiles).length)S.active=Object.keys(S.profiles)[0];
if(P())autoFreeze(P());
if(S.alarm.on&&S.alarm.end<Date.now())armAlarm();
renderAll();
})();
</script>
